name: Release (unified)

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release
        required: true
        type: string
      dry_run:
        description: Build, sign and verify without creating tags or publishing
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@v1
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry_run }}
      repository-type: openclaw
      build-runner: macos
      nfpm: disabled
      extra-packages: '[]'
      require-signed-tag: true
      strict-checks: false
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
