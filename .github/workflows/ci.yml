name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module cache
        run: GOWORK=off go mod verify

      - name: Check go.mod tidy
        run: |
          GOWORK=off go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: GOWORK=off go vet ./...

      - name: Deadcode
        run: |
          output_file=$(mktemp)
          GOWORK=off go run golang.org/x/tools/cmd/deadcode@v0.50.0 -test ./... > "$output_file"
          if [ -s "$output_file" ]; then
            cat "$output_file"
            exit 1
          fi

      - name: Test
        run: GOWORK=off go test -count=1 ./...

      - name: Build
        run: |
          mkdir -p bin
          GOWORK=off go build -trimpath -ldflags "-X main.version=ci" -o bin/photoscrawl ./cmd/photoscrawl
          test "$(bin/photoscrawl --version)" = "ci"

  vulnerabilities:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOENV: "off"
      GOTOOLCHAIN: "local"
      GOMAXPROCS: "2"
      GOFLAGS: "-mod=readonly -p=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Verify structured scan evaluator
        run: python3 .github/scripts/test_vulncheck.py

      - name: Stage public modules, scanner and frozen advisories
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.27.1"
          go mod download
          GOBIN="$RUNNER_TEMP/vulntools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          python3 .github/scripts/vulncheck.py stage "$RUNNER_TEMP/vulndb"

      - name: Scan native configuration
        run: python3 .github/scripts/vulncheck.py scan "$RUNNER_TEMP/vulndb" "$RUNNER_TEMP/vulntools/govulncheck" "$RUNNER_TEMP/vuln-preferred" go1.27.1 darwin

      - name: Retain complete advisory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-vulnerability-evidence
          path: |
            ${{ runner.temp }}/vulndb
            ${{ runner.temp }}/vuln-preferred
          if-no-files-found: error
