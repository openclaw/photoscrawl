version: 2

project_name: photoscrawl

builds:
  - id: photoscrawl
    main: ./cmd/photoscrawl
    binary: "{{ .Os }}_{{ .Arch }}/photoscrawl"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-O2 -g -mmacosx-version-min=13.0
      - CGO_LDFLAGS=-O2 -g -mmacosx-version-min=13.0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    hooks:
      post:
        - cmd: bash .github/scripts/check_macos_minimum.sh "{{ .Path }}"

archives:
  - id: bundles
    ids:
      - photoscrawl
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    strip_binary_directory: true
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true
